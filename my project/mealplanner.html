<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Meal Planner - Everyday Meals</title>
		<link rel="stylesheet" href="styles.css">
	</head>

	<body>

		<header>
			<div class="logo-title">
				<img src="logo.jpg" alt="Everyday Meals Logo" class="logo">
				<h1>Everyday Meals</h1>
			</div>
			<button class="menu-toggle" onclick="toggleMenu()">☰</button>
			<nav>
				<a href="index.html">Home</a>
				<a href="Recipes.html">Popular Recipes</a>
				<a href="stepbystep.html">Step-by-Step Guides</a>
				<a href="tips.html">Tips & Tricks</a>
				<a href="mealplanner.html">Meal Planner</a>
				<a href="about.html">About</a>
				<a href="contact.html">Contact</a>
			</nav>
		</header>

		<main>
			<section class="welcome">
				<h2>Weekly Meal Planner</h2>
				<p>Plan your meals for the week and keep track of ingredients you need.</p>
			</section>
			<section class="contact-container">
				<h2>Create Your Meal Plan</h2>
				<form id="mealForm">

					<label>Day of the Week:</label>
					<select id="day">
						<option value="">Select a day</option>
						<option>Monday</option>
						<option>Tuesday</option>
						<option>Wednesday</option>
						<option>Thursday</option>
						<option>Friday</option>
						<option>Saturday</option>
						<option>Sunday</option>
					</select>
					<label>Meal Name:</label>
					<input type="text" id="mealName" placeholder="e.g. Garlic Chicken Pasta">
					<label>Ingredients Needed:</label>
					<textarea id="ingredients" rows="4" placeholder="List ingredients separated by commas"></textarea>
					<button type="submit">Add to Planner</button>
				</form>
			</section>
			<section class="comments-section">
				<h2>Your Weekly Meal Plan</h2>
				<div id="mealPlanList"></div>
			</section>
		</main>

		<footer>
			<p>&copy; 2026 Everyday Meals</p>
		</footer>

		<script src="script.js"></script>

	</body>
</html>
